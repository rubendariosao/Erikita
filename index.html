    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 50%, #0d1b2a 100%);
            overflow-x: hidden;
            touch-action: manipulation;
        }

        .font-love {
            font-family: 'Dancing Script', cursive;
        }

        /* Estilos de Pétalos Cayendo */
        .petal {
            position: absolute;
            background: linear-gradient(45deg, #ffd700, #ffae00);
            border-radius: 15px 0px 15px 0px;
            pointer-events: none;
            opacity: 0.8;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg) scale(0.8);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(360deg) scale(1.2);
                opacity: 0.2;
            }
        }

        /* Brillos mágicos */
        .sparkle {
            position: absolute;
            background: radial-gradient(circle, #fff 10%, rgba(255, 215, 0, 0.8) 50%, transparent 80%);
            border-radius: 50%;
            pointer-events: none;
            animation: pulseSparkle 2s infinite ease-in-out alternate;
        }

        @keyframes pulseSparkle {
            0% { transform: scale(0.5); opacity: 0.3; }
            100% { transform: scale(1.4); opacity: 1; }
        }

        /* Animación de crecimiento de flores */
        .flower-grow {
            transform-origin: bottom center;
            animation: growIn 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.27) forwards;
        }

        @keyframes growIn {
            0% { transform: scale(0) rotate(-10deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        /* Efecto Neón y Glow */
        .glow-text {
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.6), 0 0 30px rgba(255, 174, 0, 0.4);
        }

        .card-glass {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);

            border: 1px solid rgba(255, 215, 0, 0.2);

        /* Ocultar barra de scroll silenciosamente */

    </style>

<body class="min-h-screen text-white relative flex flex-col justify-between items-center px-4 py-6 select-none overflow-y-auto">

                    <path d="M 200 230 Q 200 160 200 90" stroke="url(#stemGrad)" stroke-width="7" fill="none" stroke-linecap="round"/>
                    <path d="M 200 230 Q 210 170 250 120" stroke="url(#stemGrad)" stroke-width="6" fill="none" stroke-linecap="round"/>

                <g id="leaves">

    <!-- Modal Nota Romántica -->

            <button onclick="closeNote()" class="absolute top-3 right-4 text-yellow-300/70 hover:text-yellow-200 text-2xl font-bold">&times;</button>
            <div class="text-4xl mb-3" id="note-emoji">🌻</div>

    </div>

    <!-- Barra Inferior de Botones Interactivos -->
    <footer class="w-full max-w-md z-20 pb-2">
        <div class="card-glass p-3 rounded-2xl flex justify-around items-center gap-2 border border-yellow-500/20 shadow-lg">
            
            <!-- Botón 1: Más Flores -->
            <button onclick="addMoreFlowers()" class="flex-1 flex flex-col items-center justify-center p-2 rounded-xl bg-yellow-500/10 hover:bg-yellow-500/20 active:scale-90 transition border border-yellow-400/30">

    <script>
        const petalsContainer = document.getElementById('petals-container');
        const lightsContainer = document.getElementById('lights-container');
        let magicLightsActive = false;

        // Crear pétalos flotantes
        function createPetal() {
            const petal = document.createElement('div');
            petal.classList.add('petal');
            
            // Tamaño aleatorio
            const size = Math.random() * 12 + 10;
            petal.style.width = `${size}px`;
            petal.style.height = `${size * 1.5}px`;
            
            // Posición inicial x
            petal.style.left = `${Math.random() * 100}vw`;
            
            // Duración y retraso de animación
            const duration = Math.random() * 5 + 5;
            petal.style.animationDuration = `${duration}s`;
            
            petalsContainer.appendChild(petal);

            // Eliminar pétalo tras finalizar animación
            setTimeout(() => {
                petal.remove();
            }, duration * 1000);
        }

        // Bucle continuo de pétalos
        setInterval(createPetal, 400);

        const romanticNotes = [
            { emoji: "🌻", title: "Para mi Erikita", text: "Así como los girasoles buscan siempre el sol, yo siempre busco la luz de tu sonrisa." },
            { emoji: "🌹", title: "Rosas Amarillas", text: "Las rosas amarillas simbolizan alegría, calidez y el amor puro que siento por ti cada día." },
            { emoji: "💛", title: "Un detalle especial", text: "No importa dónde esté, mi lugar favorito siempre será a tu lado. ¡I Love Erikita!" },
            { emoji: "✨", title: "Eres Mágica", text: "Gracias por llenar mi vida de color, risas y momentos inolvidables." }
        ];
        let noteIndex = 0;

        function addMoreFlowers() {
            const svgGroup = document.getElementById('flowers-group');
            const stemsGroup = document.getElementById('stems');
            
            // Posiciones aleatorias alrededor del ramo
            const randomX = Math.floor(Math.random() * 140) + 130;
            const randomY = Math.floor(Math.random() * 80) + 80;
            const scale = (Math.random() * 0.4 + 0.6).toFixed(2);

            // Crear nuevo tallo
            const newStem = document.createElementNS("http://www.w3.org/2000/svg", "path");
            newStem.setAttribute("d", `M 200 230 Q ${(200 + randomX)/2} 180 ${randomX} ${randomY + 20}`);
            newStem.setAttribute("stroke", "url(#stemGrad)");
            newStem.setAttribute("stroke-width", "5");
            newStem.setAttribute("fill", "none");
            stemsGroup.appendChild(newStem);

            // Crear flor (Girasol pequeño)
            const newFlower = document.createElementNS("http://www.w3.org/2000/svg", "g");
            newFlower.classList.add("flower-grow");
            newFlower.style.transformOrigin = `${randomX}px ${randomY}px`;
            
            newFlower.innerHTML = `
                <g fill="url(#yellowPetal)">
                    <ellipse cx="${randomX}" cy="${randomY - 15}" rx="5" ry="15" />
                    <ellipse cx="${randomX}" cy="${randomY + 15}" rx="5" ry="15" />
                    <ellipse cx="${randomX - 15}" cy="${randomY}" rx="15" ry="5" />
                    <ellipse cx="${randomX + 15}" cy="${randomY}" rx="15" ry="5" />
                </g>
                <circle cx="${randomX}" cy="${randomY}" r="10" fill="url(#sunflowerCenter)" stroke="#f4a261" stroke-width="1.5" />
            `;
            
            svgGroup.appendChild(newFlower);

            // Lanzar pequeños destellos al florecer
            confetti({
                particleCount: 15,
                spread: 40,
                origin: { y: 0.6 },
                colors: ['#ffd700', '#ffae00', '#ffffff']
            });
        }

        function toggleMagicLights() {
            magicLightsActive = !magicLightsActive;
            const icon = document.getElementById('light-btn-icon');
            
            if (magicLightsActive) {
                icon.innerText = "🌟";
                // Generar varias luciérnagas
                for (let i = 0; i < 25; i++) {
                    const sparkle = document.createElement('div');
                    sparkle.classList.add('sparkle');
                    const size = Math.random() * 8 + 4;
                    sparkle.style.width = `${size}px`;
                    sparkle.style.height = `${size}px`;
                    sparkle.style.top = `${Math.random() * 90}vh`;
                    sparkle.style.left = `${Math.random() * 90}vw`;
                    sparkle.style.animationDelay = `${Math.random() * 2}s`;
                    sparkle.dataset.magic = "true";
                    lightsContainer.appendChild(sparkle);
                }
            } else {
                icon.innerText = "✨";
                // Eliminar luciérnagas
                const sparkles = document.querySelectorAll('[data-magic="true"]');
                sparkles.forEach(el => el.remove());
            }
        }

        function showRomanticNote() {
            const modal = document.getElementById('note-modal');
            const modalCard = document.getElementById('modal-card');
            const note = romanticNotes[noteIndex];

            document.getElementById('note-emoji').innerText = note.emoji;
            document.getElementById('note-title').innerText = note.title;
            document.getElementById('note-text').innerText = note.text;

            modal.classList.remove('hidden');
            setTimeout(() => {
                modalCard.classList.remove('scale-90');
                modalCard.classList.add('scale-100');
            }, 10);

            // Rotar a la siguiente nota para la próxima vez
            noteIndex = (noteIndex + 1) % romanticNotes.length;
        }

        function closeNote() {
            const modal = document.getElementById('note-modal');
            const modalCard = document.getElementById('modal-card');
            
            modalCard.classList.remove('scale-100');
            modalCard.classList.add('scale-90');
            
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        function triggerSurprise() {
            // Explosión de confeti dorado y corazones
            confetti({
                particleCount: 80,
                spread: 70,
                origin: { y: 0.7 },
                colors: ['#ffd700', '#ffae00', '#e63946', '#ffffff']
            });

            // Animación temporal en el texto principal
            const title = document.querySelector('h1');
            title.classList.add('scale-110');
            setTimeout(() => title.classList.remove('scale-110'), 300);
