<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flores Amarillas para Erikita 🌻</title>
  <link href="[https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@300;400;600&display=swap](https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Poppins:wght@300;400;600&display=swap)" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0d1b2a, #1b263b, #0f172a);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
      color: #fff;
      padding: 20px 10px;
    }
    header { text-align: center; margin-top: 10px; z-index: 10; }
    .badge {
      background: rgba(255, 215, 0, 0.15);
      border: 1px solid rgba(255, 215, 0, 0.4);
      color: #ffd700;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 0.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    h1 {
      font-family: 'Caveat', cursive;
      font-size: 3.2rem;
      color: #ffe600;
      text-shadow: 0 0 15px rgba(255, 230, 0, 0.6), 0 0 30px rgba(255, 215, 0, 0.3);
      margin: 10px 0 5px;
    }
    p.subtitle { font-size: 0.9rem; color: #cbd5e1; font-style: italic; }
    .garden {
      position: relative;
      width: 100%;
      max-width: 380px;
      height: 380px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 5;
    }
    .pot {
      width: 140px;
      height: 90px;
      background: linear-gradient(to bottom, #d97706, #92400e);
      clip-path: polygon(0 0, 100% 0, 82% 100%, 18% 100%);
      border-radius: 0 0 10px 10px;
      z-index: 10;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .pot-rim {
      position: absolute;
      bottom: 80px;
      width: 156px;
      height: 18px;
      background: #f59e0b;
      border-radius: 8px;
      z-index: 11;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .flower {
      position: absolute;
      bottom: 85px;
      transform-origin: bottom center;
      transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 5;
    }
    .stem {
      width: 8px;
      height: 160px;
      background: linear-gradient(to top, #15803d, #22c55e);
      margin: 0 auto;
      border-radius: 4px;
      position: relative;
    }
    .leaf {
      position: absolute;
      width: 30px;
      height: 15px;
      background: #22c55e;
      border-radius: 15px 0;
    }
    .leaf.left { left: -25px; top: 60px; transform: rotate(-25deg); }
    .leaf.right { right: -25px; top: 90px; transform: rotate(105deg); }
    .head {
      position: absolute;
      top: -40px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 80px;
    }
    .center {
      position: absolute;
      width: 36px;
      height: 36px;
      background: radial-gradient(circle, #78350f, #451a03);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      box-shadow: inset 0 0 5px #000;
    }
    .petals {
      position: absolute;
      width: 100%;
      height: 100%;
      animation: rotateFlower 20s linear infinite;
    }
    .petal {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 16px;
      height: 38px;
      background: linear-gradient(to top, #f59e0b, #facc15);
      border-radius: 50% 50% 10% 10%;
      transform-origin: center bottom;
      margin-left: -8px;
      margin-top: -38px;
      box-shadow: 0 0 5px rgba(250, 204, 21, 0.4);
    }
    @keyframes rotateFlower {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .f1 { transform: scale(1.1); z-index: 7; }
    .f2 { transform: translateX(-45px) rotate(-15deg) scale(0.95); z-index: 6; }
    .f3 { transform: translateX(45px) rotate(15deg) scale(0.95); z-index: 6; }
    .controls {
      display: flex;
      gap: 10px;
      z-index: 20;
      width: 100%;
      max-width: 380px;
      justify-content: center;
      margin-bottom: 10px;
    }
    button {
      flex: 1;
      padding: 12px 8px;
      border: none;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: all 0.3s ease;
    }
    button:active { transform: scale(0.95); background: rgba(250, 204, 21, 0.2); }
    .falling-petal {
      position: fixed;
      top: -20px;
      background: #facc15;
      border-radius: 50% 0 50% 50%;
      opacity: 0.8;
      pointer-events: none;
      animation: fall linear infinite;
      z-index: 1;
    }
    @keyframes fall {
      to { transform: translateY(105vh) rotate(720deg); }
    }
    .modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      padding: 20px;
    }
    .modal.active { opacity: 1; pointer-events: auto; }
    .modal-card {
      background: #1e293b;
      border: 1px solid #facc15;
      padding: 25px;
      border-radius: 20px;
      text-align: center;
      max-width: 320px;
      box-shadow: 0 0 30px rgba(250, 204, 21, 0.3);
      transform: translateY(20px);
      transition: transform 0.4s ease;
    }
    .modal.active .modal-card { transform: translateY(0); }
    .modal-card h2 { font-family: 'Caveat', cursive; color: #facc15; font-size: 2.2rem; }
    .modal-card p { font-size: 0.95rem; color: #e2e8f0; margin: 15px 0 20px; line-height: 1.5; }
    .close-btn {
      background: #facc15;
      color: #0f172a;
      padding: 8px 20px;
      border-radius: 10px;
      font-weight: bold;
      width: auto;
    }
  </style>
</head>
<body>

  <header>
    <div class="badge">ESPECIALMENTE PARA TI ✨</div>
    <h1>I love Erikita</h1>
    <p class="subtitle">"Un jardín entero de flores amarillas para iluminar tu día"</p>
  </header>

  <div class="garden">
    <div class="flower f2">
      <div class="stem"><div class="leaf left"></div></div>
      <div class="head"><div class="center"></div><div class="petals"></div></div>
    </div>
    <div class="flower f1">
      <div class="stem"><div class="leaf left"></div><div class="leaf right"></div></div>
      <div class="head"><div class="center"></div><div class="petals"></div></div>
    </div>
    <div class="flower f3">
      <div class="stem"><div class="leaf right"></div></div>
      <div class="head"><div class="center"></div><div class="petals"></div></div>
    </div>
    <div class="pot-rim"></div>
    <div class="pot"></div>
  </div>

  <div class="controls">
    <button onclick="addFlowers()">🌸 <span>Más Flores</span></button>
    <button onclick="toggleGlow()">✨ <span>Luces</span></button>
    <button onclick="openModal()">💌 <span>Carta</span></button>
    <button onclick="rainHearts()">💛 <span>Te Amo</span></button>
  </div>

  <div class="modal" id="cardModal">
    <div class="modal-card">
      <h2>Para Erikita 🌻</h2>
      <p>Estas flores nunca se marchitan, igual que mi cariño por ti. Espero que este detalle te saque una hermosa sonrisa hoy.</p>
      <button class="close-btn" onclick="closeModal()">Cerrar ❤️</button>
    </div>
  </div>

  <script>
    document.querySelectorAll('.petals').forEach(petalsContainer => {
      for (let i = 0; i < 12; i++) {
        const petal = document.createElement('div');
        petal.className = 'petal';
        petal.style.transform = `rotate(${i * 30}deg)`;
        petalsContainer.appendChild(petal);
      }
    });

    function createPetal() {
      const petal = document.createElement('div');
      petal.className = 'falling-petal';
      petal.style.left = Math.random() * 100 + 'vw';
      petal.style.width = (Math.random() * 12 + 8) + 'px';
      petal.style.height = (Math.random() * 20 + 12) + 'px';
      petal.style.animationDuration = (Math.random() * 3 + 3) + 's';
      document.body.appendChild(petal);
      setTimeout(() => petal.remove(), 6000);
    }
    setInterval(createPetal, 300);

    function openModal() { document.getElementById('cardModal').classList.add('active'); }
    function closeModal() { document.getElementById('cardModal').classList.remove('active'); }

    function rainHearts() {
      for(let i = 0; i < 20; i++) {
        setTimeout(() => {
          const heart = document.createElement('div');
          heart.innerHTML = '💛';
          heart.style.position = 'fixed';
          heart.style.left = Math.random() * 100 + 'vw';
          heart.style.top = '-20px';
          heart.style.fontSize = (Math.random() * 20 + 20) + 'px';
          heart.style.transition = 'all 2s ease-in';
          heart.style.zIndex = '99';
          document.body.appendChild(heart);
          setTimeout(() => {
            heart.style.transform = `translateY(100vh) rotate(${Math.random() * 360}deg)`;
            heart.style.opacity = '0';
          }, 50);
          setTimeout(() => heart.remove(), 2100);
        }, i * 100);
      }
    }

    let glowing = false;
    function toggleGlow() {
      glowing = !glowing;
      document.querySelectorAll('.flower').forEach(f => {
        f.style.filter = glowing ? 'drop-shadow(0 0 15px #facc15)' : 'none';
      });
    }

    function addFlowers() {
      const garden = document.querySelector('.garden');
      const newF = document.createElement('div');
      newF.className = 'flower';
      const offset = (Math.random() * 120 - 60);
      const scale = (Math.random() * 0.3 + 0.7);
      newF.style.transform = `translateX(${offset}px) scale(${scale})`;
      newF.style.zIndex = '4';
      newF.innerHTML = `
        <div class="stem"><div class="leaf left"></div></div>
        <div class="head"><div class="center"></div><div class="petals"></div></div>
      `;
      const petalsContainer = newF.querySelector('.petals');
      for (let i = 0; i < 12; i++) {
        const petal = document.createElement('div');
        petal.className = 'petal';
        petal.style.transform = `rotate(${i * 30}deg)`;
        petalsContainer.appendChild(petal);
      }
      garden.appendChild(newF);
    }
  </script>
</body>
</html>
